name: Nightly
run-name: "OpenVCS-Plugin-Git Nightly • Run #${{ github.run_number }} • ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'Dev' }}"

on:
  schedule:
    # 01:35 UTC daily
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if no changes since last nightly tag
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'Dev' }}

jobs:
  check-changes:
    name: Check if target ref changed since last nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      since_sha: ${{ steps.diff.outputs.since_sha }}
      ahead_count: ${{ steps.diff.outputs.ahead_count }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine diff vs openvcs-git-nightly
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          TAG="openvcs-git-nightly"

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "changed=true"       >> "$GITHUB_OUTPUT"
            echo "since_sha=(none)"   >> "$GITHUB_OUTPUT"
            echo "ahead_count=INIT"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SINCE_SHA="$(git rev-list -n 1 "$TAG")"
          echo "since_sha=$SINCE_SHA" >> "$GITHUB_OUTPUT"

          if git diff --quiet "$TAG"..HEAD -- src Cargo.toml Cargo.lock openvcs.plugin.json; then
            echo "changed=false"      >> "$GITHUB_OUTPUT"
            echo "ahead_count=0"      >> "$GITHUB_OUTPUT"
          else
            AHEAD="$(git rev-list --count "$TAG"..HEAD -- src Cargo.toml Cargo.lock openvcs.plugin.json || echo 1)"
            echo "changed=true"       >> "$GITHUB_OUTPUT"
            echo "ahead_count=$AHEAD" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build bundle (${{ matrix.os }})
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.force == true || github.event.inputs.force == 'true'))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: '2G'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout target ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Build plugin
        run: cargo build --release -p openvcs-git-plugin

      - name: Assemble bundle (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          PLUGIN_ID="openvcs.git"
          OUT="dist/${PLUGIN_ID}-${{ runner.os }}-${ARCH}"
          mkdir -p "${OUT}/bin"
          cp openvcs.plugin.json "${OUT}/openvcs.plugin.json"
          cp target/release/openvcs-git-plugin "${OUT}/bin/openvcs-git-plugin"
          tar -C dist -czf "${PLUGIN_ID}-${{ runner.os }}-${ARCH}.tar.gz" "$(basename "${OUT}")"

      - name: Assemble bundle (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pluginId = "openvcs.git"
          $out = "dist/$pluginId-Windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          Copy-Item openvcs.plugin.json "$out/openvcs.plugin.json" -Force
          Copy-Item target\\release\\openvcs-git-plugin.exe "$out/bin/openvcs-git-plugin.exe" -Force
          Compress-Archive -Path "$out/*" -DestinationPath "$pluginId-Windows-x86_64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvcs-git-nightly-${{ runner.os }}
          path: |
            openvcs.git-*.tar.gz
            openvcs.git-*.zip

  release:
    name: Publish rolling nightly prerelease
    needs: [check-changes, build]
    if: needs.check-changes.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.force == true || github.event.inputs.force == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout target ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Compute metadata (date, short SHA, compare, changelog)
        id: meta
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const target = process.env.TARGET_REF || 'Dev';
            let branch_sha = context.sha;
            try {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: target });
              branch_sha = branch?.data?.commit?.sha || context.sha;
            } catch (e) {
              branch_sha = context.sha;
            }
            const short = branch_sha.substring(0, 7);
            const basehead = `openvcs-git-nightly...${target}`;
            let compare_url = `${context.serverUrl}/${owner}/${repo}/compare/${basehead}`;
            let changelog = '';
            try {
              const res = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead });
              const commits = res?.data?.commits ?? [];
              if (commits.length === 0) {
                changelog = `No changes detected.`;
              } else {
                const items = commits.map(c => {
                  const sha = (c.sha || '').substring(0, 7);
                  const msg = (c.commit?.message || '').split('\\n')[0];
                  const author = c.author?.login || c.commit?.author?.name || 'unknown';
                  return `- ${sha} ${msg} (@${author})`;
                });
                changelog = items.join('\\n');
              }
            } catch (e) {
              changelog = `First nightly or previous tag unavailable; showing recent commits at ${target}.`;
              compare_url = `${context.serverUrl}/${owner}/${repo}/tree/${target}`;
            }
            core.setOutput('short_sha', short);
            core.setOutput('branch_sha', branch_sha);
            core.setOutput('date', date);
            core.setOutput('compare_url', compare_url);
            core.setOutput('changelog', changelog);

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Remove existing 'openvcs-git-nightly' release & tag (if any)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const tag   = 'openvcs-git-nightly';
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const rel = releases.find(r => r.tag_name === tag);
            if (rel) await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

      - name: Create Nightly prerelease
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: openvcs-git-nightly
          name: "OpenVCS-Plugin-Git Nightly ${{ steps.meta.outputs.date }} (${{ env.TARGET_REF }}@${{ steps.meta.outputs.short_sha }})"
          prerelease: true
          generate_release_notes: false
          body: |
            Nightly build from `${{ env.TARGET_REF }}`.
            Date (UTC): ${{ steps.meta.outputs.date }}
            Compare: ${{ steps.meta.outputs.compare_url }}
            Since: ${{ needs.check-changes.outputs.since_sha }}
            Ahead (relevant commits): ${{ needs.check-changes.outputs.ahead_count }}
            Commit: ${{ steps.meta.outputs.branch_sha }} (${{ env.TARGET_REF }}@${{ steps.meta.outputs.short_sha }})
            Runner: ${{ runner.os }} • Run #${{ github.run_number }}

            Changes since last nightly:
            ${{ steps.meta.outputs.changelog }}
          files: |
            artifacts/**/*
