name: Dev CI (fast)

on:
  push:
    branches: [Dev]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'test/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'icon.png'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [Dev]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'test/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'icon.png'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript type check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Create dist directory
        run: mkdir -p dist

      - name: Pack plugin
        run: npm pack --pack-destination dist

      - name: Verify package
        shell: bash
        run: test -n "$(ls dist/*.tgz 2>/dev/null)"
