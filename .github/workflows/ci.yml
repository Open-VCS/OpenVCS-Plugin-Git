name: Dev CI (fast)

on:
  push:
    branches: [Dev]
    paths:
      - 'bin/**'
      - 'openvcs.plugin.json'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'icon.png'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [Dev]
    paths:
      - 'bin/**'
      - 'openvcs.plugin.json'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'icon.png'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (syntax check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package plugin (.ovcsp)
        run: npm run dist

      - name: Verify package
        run: test -f dist/openvcs.git.ovcsp
