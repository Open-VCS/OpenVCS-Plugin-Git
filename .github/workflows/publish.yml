name: publish
run-name: "OpenVCS-Plugin-Git • Publish • Run #${{ github.run_number }} • ${{ github.event_name == 'schedule' && 'Nightly@Dev' || github.ref_name == 'Dev' && 'Edge@Dev' || github.ref_name }}"

on:
  push:
    branches: [Stable, Beta, Dev]
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish prerelease even if no changes since the last rolling tag
        type: boolean
        required: false
        default: false
      tag:
        description: Override stable GitHub release tag
        required: false
        type: string
      prerelease:
        description: Mark manual stable GitHub release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  TARGET_REF: ${{ github.event_name == 'schedule' && 'Dev' || github.ref_name }}

jobs:
  check-prerelease:
    name: Check for Git prerelease changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      since_sha: ${{ steps.diff.outputs.since_sha }}
      ahead_count: ${{ steps.diff.outputs.ahead_count }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine diff vs rolling prerelease tag
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "Stable" ] || [ "${GITHUB_REF_NAME}" = "Beta" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "since_sha=(release)" >> "$GITHUB_OUTPUT"
            echo "ahead_count=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TAG="openvcs-git-nightly"
          else
            TAG="openvcs-git-edge"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "since_sha=(none)" >> "$GITHUB_OUTPUT"
            echo "ahead_count=INIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SINCE_SHA="$(git rev-list -n 1 "$TAG")"
          echo "since_sha=$SINCE_SHA" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$TAG"..HEAD -- src README.md ARCHITECTURE.md icon.png LICENSE package.json package-lock.json tsconfig.json test/ .github/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ahead_count=0" >> "$GITHUB_OUTPUT"
          else
            AHEAD="$(git rev-list --count "$TAG"..HEAD -- src README.md ARCHITECTURE.md icon.png LICENSE package.json package-lock.json tsconfig.json test/ .github/workflows || echo 1)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ahead_count=$AHEAD" >> "$GITHUB_OUTPUT"
          fi

  build-artifact:
    name: Build package artifact
    if: github.ref_name == 'Stable' || (github.event_name == 'schedule' && (needs.check-prerelease.outputs.changed == 'true' || (inputs.force == true || github.event.inputs.force == 'true')))
    needs: [check-prerelease]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create dist directory
        run: mkdir -p dist

      - name: Pack plugin
        run: npm pack --pack-destination dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openvcs-git-package
          path: dist/*.tgz

  publish-npm:
    name: Publish @openvcs/git-plugin to npm
    if: github.ref_name == 'Stable' || github.ref_name == 'Beta' || github.ref_name == 'Dev' || github.event_name == 'schedule'
    needs: [check-prerelease]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compute publish metadata
        id: meta
        shell: bash
        env:
          FORCE_ROLLING: ${{ github.event_name == 'workflow_dispatch' && (inputs.force || false) }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          if [ "${GITHUB_REF_NAME:-}" = "Stable" ]; then
            VERSION="$BASE_VERSION"
            DIST_TAG="latest"
            SHOULD_PUBLISH="true"
          elif [ "${GITHUB_REF_NAME:-}" = "Beta" ]; then
            VERSION="${BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
            DIST_TAG="beta"
            SHOULD_PUBLISH="true"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            VERSION="${BASE_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            DIST_TAG="nightly"
            if [ "${{ needs.check-prerelease.outputs.changed || 'false' }}" = "true" ] || [ "${FORCE_ROLLING}" = "true" ]; then
              SHOULD_PUBLISH="true"
            else
              SHOULD_PUBLISH="false"
            fi
          elif [ "${GITHUB_REF_NAME:-}" = "Dev" ]; then
            VERSION="${BASE_VERSION}-edge.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            DIST_TAG="edge"
            if [ "${{ needs.check-prerelease.outputs.changed || 'false' }}" = "true" ] || [ "${FORCE_ROLLING}" = "true" ]; then
              SHOULD_PUBLISH="true"
            else
              SHOULD_PUBLISH="false"
            fi
          else
            VERSION="${BASE_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            DIST_TAG="nightly"
            SHOULD_PUBLISH="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stop when prerelease is unchanged
        if: steps.meta.outputs.should_publish != 'true'
        run: |
          echo "No Git prerelease changes since last publish; skipping."

      - name: Apply publish version
        if: steps.meta.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.RELEASE_VERSION; if (pkg.openvcs && typeof pkg.openvcs === 'object') pkg.openvcs.version=process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2)+'\n');"

      - name: Verify npm package contents
        if: steps.meta.outputs.should_publish == 'true'
        run: npm pack --dry-run

      - name: Publish npm package
        if: steps.meta.outputs.should_publish == 'true'
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Update rolling prerelease tag
        if: steps.meta.outputs.should_publish == 'true' && (steps.meta.outputs.dist_tag == 'nightly' || steps.meta.outputs.dist_tag == 'edge')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.DIST_TAG === 'edge' ? 'openvcs-git-edge' : 'openvcs-git-nightly';
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              if (e.status !== 422) throw e;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: process.env.TARGET_SHA || context.sha });

  release-github:
    name: Create GitHub release
    if: github.ref_name == 'Stable' || (github.event_name == 'schedule' && (needs.check-prerelease.outputs.changed == 'true' || (inputs.force == true || github.event.inputs.force == 'true')))
    needs: [build-artifact, publish-npm]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME:-}" = "Stable" ]; then
            echo "tag=$(node -p "'openvcs-git-v' + require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "tag=openvcs-git-nightly" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: openvcs-git-package
          path: artifacts

      - name: Remove existing nightly release & tag
        if: steps.tag.outputs.tag == 'openvcs-git-nightly'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'openvcs-git-nightly';
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const rel = releases.find(r => r.tag_name === tag);
            if (rel) await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.tag == 'openvcs-git-nightly' || (github.event_name == 'workflow_dispatch' && (inputs.prerelease || false)) }}
          generate_release_notes: ${{ steps.tag.outputs.tag != 'openvcs-git-nightly' }}
          files: |
            artifacts/*
