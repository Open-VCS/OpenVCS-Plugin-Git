name: publish-stable
run-name: "OpenVCS-Plugin-Git • Release • Run #${{ github.run_number }}"

on:
  push:
    branches: [Stable]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: openvcs-git-v<package version>)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack plugin
        run: npm pack --pack-destination dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openvcs-git-ubuntu
          path: dist/*.tgz

  release:
    name: Create GitHub Pre-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="$(node -p "'openvcs-git-v' + require('./package.json').version")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: openvcs-git-ubuntu
          path: artifacts

      - name: Create prerelease
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            artifacts/*

  publish-npm:
    name: Publish @openvcs/git-plugin to npm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish npm package
        run: npm publish --provenance --access public
