name: publish-stable
run-name: "OpenVCS-Plugin-Git • Release • Run #${{ github.run_number }}"

on:
  push:
    branches: [Stable]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: openvcs-git-v<Cargo.toml version>)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: '2G'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout OpenVCS-Plugin-Git
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: OpenVCS-Plugin-Git
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          targets: wasm32-wasip1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            OpenVCS-Plugin-Git

      - name: Install cargo-openvcs (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo install openvcs-sdk --locked --bin cargo-openvcs

      - name: Install cargo-openvcs (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo install openvcs-sdk --locked --bin cargo-openvcs

      - name: Build + package (.ovcsp) (unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: OpenVCS-Plugin-Git
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          cargo openvcs dist --plugin-dir . --out dist
          mv "dist/openvcs.git.ovcsp" "dist/openvcs.git-${{ runner.os }}-${ARCH}.ovcsp"

      - name: Build + package (.ovcsp) (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: OpenVCS-Plugin-Git
        run: |
          $arch = $env:PROCESSOR_ARCHITECTURE
          if ([string]::IsNullOrWhiteSpace($arch)) { $arch = "x86_64" }
          cargo openvcs dist --plugin-dir . --out dist
          Move-Item -Path "dist\\openvcs.git.ovcsp" -Destination ("dist\\openvcs.git-Windows-{0}.ovcsp" -f $arch) -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openvcs-git-${{ runner.os }}
          path: |
            OpenVCS-Plugin-Git/dist/openvcs.git-*.ovcsp

  release:
    name: Create GitHub Pre-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          ver = data["package"]["version"]
          print(f"openvcs-git-v{ver}")
          PY
          )"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create prerelease
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/**/*
